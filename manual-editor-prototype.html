<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Manual Editor 試験版</title><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#eee;color:#222;height:100dvh;display:flex;flex-direction:column}header,footer,.bar{display:flex;gap:4px;padding:5px;align-items:center;background:#fafafa;flex-wrap:wrap}button,select,input{font:inherit;border:1px solid #bbb;border-radius:7px;background:white;min-height:44px;padding:8px}button{min-width:44px;font-size:20px}button.active{background:#cce1ff}button:disabled{opacity:.35}#view{flex:1;min-height:100px;background:#bfc5cc;overflow:hidden;touch-action:none}svg{width:100%;height:100%;display:block}#props{display:flex;gap:4px;flex-wrap:wrap;padding:5px;background:#fafafa}#props input{width:75px}#status{font-size:12px;padding:4px}footer{justify-content:center}header strong{flex:1}dialog{max-width:90vw}textarea{width:100%;min-height:100px}</style><header><strong>Manual Editor · 試験版</strong><select id="paper" aria-label="用紙"><option value="p">A4縦</option><option value="l">A4横</option></select><button id="undo" title="元に戻す">↶</button><button id="redo" title="やり直す">↷</button></header><div class="bar"><button id="multi" title="複数選択">▣</button><button id="group" title="グループ化">⊞</button><button id="ungroup" title="解除">⊟</button><button id="grid" class="active" title="グリッド">▦</button><button id="snap" class="active" title="吸着">⌗</button><button id="del" title="削除">⌫</button></div><div id="view"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div><div class="bar" style="justify-content:center"><button id="minus" title="縮小">−</button><span id="zoom">100%</span><button id="plus" title="拡大">＋</button><button id="fit" title="全体表示">⛶</button><button id="left">←</button><button id="up">↑</button><button id="down">↓</button><button id="right">→</button></div><div id="props"></div><div id="status">試験版：保存機能なし。重要な制作物には使用しないでください。</div><footer><button id="text" title="文字">T</button><button id="rect" title="四角形">□</button><button id="circle" title="円">○</button><button id="arrow" title="矢印">↗</button><button id="photo" title="写真">▧</button><input id="file" type="file" accept="image/*" hidden><button id="dup" title="複製">⧉</button></footer><script>
'use strict';const $=id=>document.getElementById(id),svg=$('svg'),NS='http://www.w3.org/2000/svg';let objs=[],assets={},sel=new Set(),history=[],future=[],W=210,H=297,z=1,px=0,py=0,scale=1,ox=0,oy=0,multi=false,grid=true,snap=true,drag=null;const id=()=>Math.random().toString(36).slice(2);const clone=x=>JSON.parse(JSON.stringify(x));function state(){return clone({objs,W,H})}function commit(before){history.push(before);if(history.length>10)history.shift();future=[];render()}function restore(s){objs=s.objs;W=s.W;H=s.H;sel.clear();$('paper').value=W>H?'l':'p';render()}function el(tag,a={},parent=svg){let e=document.createElementNS(NS,tag);for(let k in a)e.setAttribute(k,a[k]);parent.append(e);return e}function selected(){return objs.filter(o=>sel.has(o.id))}function draw(o,p){let g=el('g',{transform:`translate(${o.x} ${o.y}) rotate(${o.r||0})`},p);if(o.type==='group'){o.children.forEach(c=>draw(c,g));return g}if(o.type==='photo')el('image',{href:assets[o.asset],width:o.w,height:o.h,preserveAspectRatio:'none'},g);else if(o.type==='rect')el('rect',{width:o.w,height:o.h,fill:o.color},g);else if(o.type==='circle')el('ellipse',{cx:o.w/2,cy:o.h/2,rx:o.w/2,ry:o.h/2,fill:o.color},g);else if(o.type==='arrow'){el('path',{d:`M0 ${o.h} L${o.w} 0 M${o.w-10} 0 L${o.w} 0 L${o.w} 10`,stroke:o.color,'stroke-width':1.5,fill:'none'},g)}else{let t=el('text',{x:0,y:o.font,fill:o.color,'font-size':o.font},g);o.text.split('\n').forEach((s,i)=>{el('tspan',{x:0,dy:i?o.font*1.2:0},t).textContent=s})}return g}function render(panel=true){let b=svg.getBoundingClientRect();scale=Math.min(b.width/(W+16),b.height/(H+16))*z;ox=(b.width-W*scale)/2+px;oy=(b.height-H*scale)/2+py;svg.replaceChildren();let p=el('g',{transform:`translate(${ox} ${oy}) scale(${scale})`});el('rect',{width:W,height:H,fill:'white'},p);if(grid){let d=el('defs',{},p),pat=el('pattern',{id:'g',width:5,height:5,patternUnits:'userSpaceOnUse'},d);el('path',{d:'M5 0H0V5',stroke:'#ddd','stroke-width':.2,fill:'none'},pat);el('rect',{width:W,height:H,fill:'url(#g)'},p)}for(let o of objs){let g=draw(o,p);el('rect',{width:o.w,height:o.h,fill:'transparent','data-id':o.id},g);if(sel.has(o.id)){el('rect',{width:o.w,height:o.h,fill:'none',stroke:'#1670df','stroke-width':.6,'pointer-events':'none'},g);if(sel.size===1){let s=10/scale;el('rect',{x:o.w-s/2,y:o.h-s/2,width:s,height:s,fill:'white',stroke:'#1670df','data-handle':'size','data-id':o.id},g);el('circle',{cx:o.w/2,cy:-18/scale,r:7/scale,fill:'white',stroke:'#1670df','data-handle':'rotate','data-id':o.id},g)}}} $('zoom').textContent=Math.round(z*100)+'%';$('undo').disabled=!history.length;$('redo').disabled=!future.length;if(panel)props();let o=selected()[0];$('status').textContent=o?`X ${o.x.toFixed(1)} mm / Y ${o.y.toFixed(1)} mm / ∠ ${(o.r||0).toFixed(1)}°`:'試験版：保存機能なし';}function props(){let p=$('props');p.replaceChildren();let o=selected()[0];if(!o||sel.size!==1)return;for(let [k,label] of [['x','X'],['y','Y'],['r','°']]){let l=document.createElement('label');l.textContent=label+' ';let i=document.createElement('input');i.type='number';i.step='.1';i.value=(o[k]||0).toFixed(1);i.onchange=()=>{if(!Number.isFinite(i.valueAsNumber))return;let b=state();o[k]=i.valueAsNumber;commit(b)};l.append(i);p.append(l)}if(o.type==='text'){let b=document.createElement('button');b.textContent='✎';b.onclick=()=>{let t=prompt('文字',o.text);if(t!==null){let s=state();o.text=t;commit(s)}};p.append(b)}}function add(type,extra={}){let b=state(),o={id:id(),type,x:20,y:20,w:50,h:30,r:0,color:'#64748b',...extra};objs.push(o);sel=new Set([o.id]);commit(b)}function point(e){let b=svg.getBoundingClientRect();return [(e.clientX-b.left-ox)/scale,(e.clientY-b.top-oy)/scale]}svg.onpointerdown=e=>{let k=e.target.dataset.id;if(!k){if(!multi)sel.clear();render();return}if(multi&&!e.target.dataset.handle){sel.has(k)?sel.delete(k):sel.add(k);render();return}if(!sel.has(k))sel=new Set([k]);drag={before:state(),start:point(e),items:selected().map(o=>({o,old:clone(o)})),mode:e.target.dataset.handle||'move'};svg.setPointerCapture(e.pointerId);render()};function resize(o,old,f){o.w=old.w*f;o.h=old.h*f;if(o.type==='text')o.font=old.font*f;if(o.type==='group')o.children.forEach((c,i)=>{let a=old.children[i];c.x=a.x*f;c.y=a.y*f;resize(c,a,f)})}svg.onpointermove=e=>{if(!drag)return;let [x,y]=point(e),dx=x-drag.start[0],dy=y-drag.start[1];for(let {o,old} of drag.items){if(drag.mode==='move'){o.x=old.x+dx;o.y=old.y+dy;if(snap){o.x=Math.round(o.x/5)*5;o.y=Math.round(o.y/5)*5}}else if(drag.mode==='size'){let a=old.r*Math.PI/180;resize(o,old,Math.max(.1,Math.min(20,1+(dx*Math.cos(a)+dy*Math.sin(a))/old.w)))}else{o.r=old.r+(Math.atan2(y-old.y,x-old.x)-Math.atan2(drag.start[1]-old.y,drag.start[0]-old.x))*180/Math.PI}}render(false)};svg.onpointerup=()=>{if(drag){let b=drag.before;drag=null;if(JSON.stringify(b)!==JSON.stringify(state()))commit(b);else render()}};svg.onpointercancel=()=>{if(drag){let b=drag.before;drag=null;restore(b)}};$('undo').onclick=()=>{if(history.length){future.push(state());restore(history.pop())}};$('redo').onclick=()=>{if(future.length){history.push(state());restore(future.pop())}};$('paper').onchange=()=>{let b=state();[W,H]=$('paper').value==='p'?[210,297]:[297,210];commit(b)};for(let k of ['rect','circle','arrow'])$(k).onclick=()=>add(k);$('text').onclick=()=>{let t=prompt('文字を入力','手順 01');if(t!==null)add('text',{text:t,font:5,w:80,h:20,color:'#222'})};$('photo').onclick=()=>$('file').click();$('file').onchange=async()=>{let f=$('file').files[0];if(!f)return;let url=URL.createObjectURL(f);try{let im=new Image();im.src=url;await im.decode();let s=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);let a=id();assets[a]=c.toDataURL(f.type==='image/png'?'image/png':'image/jpeg',.75);add('photo',{asset:a,w:60,h:60*c.height/c.width});c.width=c.height=1}catch(e){alert('画像を読み込めませんでした')}finally{URL.revokeObjectURL(url);$('file').value=''}};$('multi').onclick=()=>{multi=!multi;$('multi').classList.toggle('active',multi)};$('grid').onclick=()=>{grid=!grid;$('grid').classList.toggle('active',grid);render()};$('snap').onclick=()=>{snap=!snap;$('snap').classList.toggle('active',snap)};$('del').onclick=()=>{if(sel.size){let b=state();objs=objs.filter(o=>!sel.has(o.id));sel.clear();commit(b)}};$('dup').onclick=()=>{let a=selected();if(!a.length)return;let b=state();let n=a.map(o=>({...clone(o),id:id(),x:o.x+5,y:o.y+5}));objs.push(...n);sel=new Set(n.map(o=>o.id));commit(b)};$('group').onclick=()=>{let a=selected();if(a.length<2)return;if(a.some(o=>o.type==='group'||o.r)){alert('試験版では回転済み要素・グループの再グループ化は未対応');return}let b=state(),x=Math.min(...a.map(o=>o.x)),y=Math.min(...a.map(o=>o.y)),g={id:id(),type:'group',x,y,r:0,w:Math.max(...a.map(o=>o.x+o.w))-x,h:Math.max(...a.map(o=>o.y+o.h))-y,children:a.map(o=>({...o,x:o.x-x,y:o.y-y}))};objs=objs.filter(o=>!sel.has(o.id));objs.push(g);sel=new Set([g.id]);commit(b)};$('ungroup').onclick=()=>{let a=selected();if(a.length!==1||a[0].type!=='group')return;let g=a[0],b=state(),r=g.r*Math.PI/180,n=g.children.map(c=>({...c,x:g.x+c.x*Math.cos(r)-c.y*Math.sin(r),y:g.y+c.x*Math.sin(r)+c.y*Math.cos(r),r:c.r+g.r}));objs.splice(objs.indexOf(g),1,...n);sel=new Set(n.map(o=>o.id));commit(b)};for(let [k,dx,dy] of [['left',40,0],['right',-40,0],['up',0,40],['down',0,-40]])$(k).onclick=()=>{px+=dx;py+=dy;render()};$('plus').onclick=()=>{z=Math.min(4,z+.25);render()};$('minus').onclick=()=>{z=Math.max(.25,z-.25);render()};$('fit').onclick=()=>{z=1;px=py=0;render()};new ResizeObserver(()=>render()).observe($('view'));render();</script></html>
